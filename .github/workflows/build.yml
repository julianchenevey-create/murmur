name: Build Murmur.app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: |
          chmod +x scripts/*.sh
          UNIVERSAL=1 scripts/build-app.sh

      # Zip with ditto so the executable bit and bundle structure survive the download.
      - name: Zip
        run: ditto -c -k --keepParent build/Murmur.app build/Murmur.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Murmur
          path: build/Murmur.zip
          if-no-files-found: error
